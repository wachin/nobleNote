[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "noblenote"
description = "nobleNote, a cross-platform note taking application (PyQt6 port)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Christian Metscher", email = "hakaishi@web.de" },
    { name = "Fabian Deuchler", email = "Taiko000@gmail.com" },
]
keywords = ["notes", "notetaking", "qt", "pyqt6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "PyQt6>=6.5",
    "PyQt6-Qt6>=6.5",
    "PyQt6-sip>=13.6",
    "PyQt6-QtSvg>=6.5",
]
dynamic = ["version"]

[project.optional-dependencies]
# spell checking in the note editor (needs hunspell dictionaries on the system)
spell = ["hunspell>=0.5"]

[project.scripts]
noblenote = "noblenote.main:main"

[project.urls]
Homepage = "https://github.com/hakaishi/nobleNote"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { file = "src/noblenote/version.txt" }

[tool.setuptools.package-data]
noblenote = [
    "version.txt",
    "icons/*.svg",
    "icons/*.ico",
    "icons/dark/*.svg",
    "translations/*.ts",
    "translations/*.qm",
]
